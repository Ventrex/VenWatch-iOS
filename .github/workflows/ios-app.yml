name: iOS-app bouwen

# Bouwt de iOS-app (ongetekend .ipa voor SideStore/AltStore, die tekent zelf):
#  - versie 1.0.<run>, als GitHub-release (vast adres per versie)
#  - download/VenWatch-iOS.ipa (altijd de nieuwste)
#  - apps.json bijgewerkt: de SideStore/AltStore-bron, dan krijg je updates vanzelf in SideStore
on:
  push:
    branches: [main]
    paths-ignore: ['download/**', 'apps.json', 'README.md']
  pull_request:
    paths-ignore: ['download/**', 'apps.json', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gereedschap
        run: brew install xcodegen
      - name: Project maken
        run: |
          xcodegen generate
          pod install
      - name: Bouwen
        run: |
          set -o pipefail
          xcodebuild -workspace VenWatch.xcworkspace -scheme VenWatch -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.0.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            clean build 2>&1 | tee build.log | tail -n 40 || {
            grep -E "error:" build.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - name: IPA maken
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/VenWatch.app out/Payload/
          (cd out && zip -qry VenWatch-iOS.ipa Payload)
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: VenWatch-iOS
          path: out/VenWatch-iOS.ipa
      - name: Release maken en bron (apps.json) bijwerken
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: 1.0.${{ github.run_number }}
          BUILD: ${{ github.run_number }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          NOTE=$(printf '%s' "${NOTES:-Nieuwe versie}" | head -n 1)
          gh release create "v$VERSION" out/VenWatch-iOS.ipa --title "VenWatch $VERSION" --notes "$NOTE" --repo "${{ github.repository }}" \
            || gh release upload "v$VERSION" out/VenWatch-iOS.ipa --clobber --repo "${{ github.repository }}"
          URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/VenWatch-iOS.ipa"
          SIZE=$(stat -f%z out/VenWatch-iOS.ipa)
          mkdir -p download
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git pull --rebase origin main
            cp out/VenWatch-iOS.ipa download/VenWatch-iOS.ipa
            python3 .github/scripts/update-source.py "$VERSION" "$BUILD" "$URL" "$SIZE" "$NOTE"
            git add download apps.json
            git commit -m "iOS-app $VERSION [skip ci]" || exit 0
            git push && break
            git reset --hard HEAD~1; sleep 5
          done
