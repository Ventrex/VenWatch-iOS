name: iOS-app bouwen

# Bouwt de iOS-app (ongetekend .ipa voor SideStore/AltStore, die tekent zelf) en zet hem op de site:
# download/VenWatch-iOS.ipa
on:
  push:
    branches: [main]
    paths-ignore: ['download/**']
  pull_request:
    paths-ignore: ['download/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Gereedschap
        run: brew install xcodegen
      - name: Project maken
        run: |
          xcodegen generate
          pod install
      - name: Bouwen
        run: |
          set -o pipefail
          xcodebuild -workspace VenWatch.xcworkspace -scheme VenWatch -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee build.log | tail -n 40 || {
            grep -E "error:" build.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - name: IPA maken
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/VenWatch.app out/Payload/
          (cd out && zip -qry VenWatch-iOS.ipa Payload)
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: VenWatch-iOS
          path: out/VenWatch-iOS.ipa
      - name: IPA op de site zetten
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p download
          cp out/VenWatch-iOS.ipa download/VenWatch-iOS.ipa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download
          git commit -m "iOS-app ${{ github.run_number }} [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
